
---
# HuntWired Homelab
# Legacy Proxmox Maintenance Playbook
#
# Status: Work in Progress / Not Validated
#
# Originally developed for an earlier Ansible deployment.
# Requires testing against the current infrastructure.
#
# WARNING:
# This playbook performs package upgrades and may reboot hosts.
# Do not execute without validating the inventory and maintenance window.

- name: Update Proxmox nodes
  hosts: proxmox_nodes
  become: true
  serial: 1

  tasks:
    - name: Record update start time
      ansible.builtin.command: date
      register: starttime
      changed_when: false

    - name: Display update start time
      ansible.builtin.debug:
        msg: "Starting APT update at {{ starttime.stdout }}"

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: true

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after updates"
        connect_timeout: 5
        reboot_timeout: 600
      when: reboot_required.stat.exists
